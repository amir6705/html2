<html>
<head>
  <title>Rocket Mission</title>
</head>
<body>
    <center>
        <h1>Welcome to my rocket mission</h1>
        <h2>Step 1: Meet the rocket</h2>
        <img src="rocket.png" alt="A rocket ready to launch" width="350" height="350"> 

        <h2>Step 2: Our space destination</h2>
        <img src="planet.png" alt="A colourful planet in space" width="350" height="350">

        <h2>Step 2: The space explorer</h2>
        <img src="astronaut.png" alt="An astronaut exploring space" width="350" height="350">

        <h2>Mission Complete</h2>
        <p>We used the image tag to add pictures</p>

         <h2>Audio and video tags</h2>
         <audio controls loop>
            <source src="music.mp3" type="audio/mpeg">
            Your browser does not support the audio tag.
        </audio>
        <br><br>
        <video width="500" height="350" controls >
            <source src="aqua.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <h2>Iframe tag</h2>
        <iframe 
        src="https://scratch.mit.edu/projects/60917032/embed" 
        allowtransparency="true"
        width="500"
        height="400"
         frameborder="0"
         scrolling="no"
         allowfullscreen>
         </iframe>
        </center>
        </body>
        </html>
