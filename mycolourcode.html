<!DOCTYPE html>
<html lang="en">
    <head>
        <title>My colour card</title>

        <style>

            /* Universal selector - Applies to evrything on the page*/
            * {
                font-size: 16px;
            }

            /* Element Selectors */
            body {
            
            background-color: lightgray;

            }

            h1 {
                color: darkblue;

            }

            h2 {
                color: purple;
            }

            p {
                color: dimgray;
            }

            /* Class Selector */
            .my-detail {
            color: darkgreen;
            font-weight: bold;
            }

            /* ID Selector */
            #my-card {
             background-color: lightcyan;
            }

        </style>

    </head>
    <body>
        
        <h1>My Colour Card</h1>
        
        <!-- Inline CSS: Add style="Colour:____;" inside this p tag -->
         <p style="color: crimson;">Hi! this is my very own webpage.</p>

         <div id="my card">

            <h2>About me</h2>
            <p class="my-detail">My name is amir.</p>
            <p class="my-detail">My favourite colour is purple.</p>
            <p class="my-detail">My favourite subject is music.</p>
            <p class="my-detail">My favourite food is pasta.</p>

         </div>

         <h2>My Favourite Thing</h2>
         <p>My favourite animal is a hamster</p>
         <p>My favourite sport is football</p>
         <p>My favourite movie is HOPPERS</p>
     
         </body>
    </html>
